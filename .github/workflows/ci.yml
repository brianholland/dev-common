name: CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      requirements-file:
        type: string
        default: "requirements-prod.txt"
      test-path:
        type: string
        default: "tests/"
      run-tests:
        type: boolean
        default: true
      run-lint:
        type: boolean
        default: true
      install-requirements:
        type: boolean
        default: true
      check-format:
        description: >
          Fail if `ruff format` would change anything. Opt-in per repo, default
          false, because every repo has its own formatting debt to pay first and a
          central default would turn the whole fleet red at once
          (bdh-org/home-infra#314).

          This exists because the Makefile opt-in (`lint: format-check`) does NOT
          reach this workflow. self-hosted-ci.yml runs `make lint`, so a Makefile
          rule is enough there; THIS workflow runs `ruff check .` directly, because
          python.mk's lint calls $(CONDA_PREFIX)/bin/ruff and there is no conda on a
          hosted runner. A repo that added the Makefile rule and used this workflow
          therefore had a format gate that ran locally and never in CI -- which
          looks identical to having one.
        type: boolean
        default: false

# Same rule as self-hosted-ci.yml, for the same reason. GitHub-hosted minutes are
# metered rather than serialized, so the cost here is the bill instead of the
# queue -- but a superseded run is waste either way, and keeping both reusables
# identical means a repo's behaviour does not change when it moves between them.
# See self-hosted-ci.yml for why `github.repository` is in the key and why
# cancellation is confined to pull_request.
concurrency:
  group: hosted-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # The version-bump guard below diffs against the base branch, which
          # needs more than the default shallow clone.
          fetch-depth: 0

      - name: Clone dev-common submodule
        run: git submodule update --init common

      - name: Version consistency
        run: make version-check

      # A merge to main must be identifiable by version (bdh-org/dev-common#124).
      #
      # `version-check` above tests INTERNAL consistency -- Makefile VERSION
      # against __init__.py / package.json / VERSION_TXT. It has no notion of a
      # base branch, so it passes happily on a PR that changed code and forgot
      # to bump. finzeug/panoptikon#569 merged that way: VERSION stayed on a
      # number #567 had already tagged, tag-version.yml (which triggers only on
      # Makefile changes) never fired, and the deployed image reported someone
      # else's version.
      #
      # Skips repos with no VERSION line, so this cannot break a repo that does
      # not version this way. Allows a pure bump PR, which is the fix rather
      # than a violation.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//')
          base_v=$(git show "$base:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
          if [ -z "$base_v" ]; then
            echo "no VERSION on $base -- nothing to compare, skipping"
            exit 0
          fi
          if [ "$head_v" != "$base_v" ]; then
            # STRICTLY GREATER, not merely different (dev-common#180/#182).
            #
            # "Different" passes every branch in a parallel set: three panoptikon
            # PRs each branched from 2.12.105 and each bumped to 2.12.106, so each
            # differed from its base and each went green. The first merged and
            # tagged 2.12.106; the other two rode onto main under a version whose
            # tag pointed two commits behind them (finzeug/panoptikon#728/#729/#730).
            #
            # What `!=` alone lets through is a version that DECREASES -- which
            # cannot be tagged, and whose image tag collides with a build that has
            # already shipped.
            if [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)" = "$head_v" ]; then
              echo "version bumped: $base_v -> $head_v"
              exit 0
            fi
            echo "::error::VERSION went BACKWARDS: $base_v on ${{ github.base_ref }}, $head_v here."
            echo "::error::Rebase and run 'make bump-patch' -- a version that decreases"
            echo "::error::cannot be tagged, and the image tag would collide with a build"
            echo "::error::that already shipped."
            exit 1
          fi
          changed=$(git diff --name-only "$base"...HEAD | grep -v '^Makefile$' || true)
          if [ -z "$changed" ]; then
            echo "nothing changed but the Makefile -- nothing to version"
            exit 0
          fi
          # COLLISION, not a missing bump -- and they need opposite remedies, so
          # they must not share a message. If this branch DID bump relative to the
          # point it forked from, and the base has since reached that same version,
          # then another PR merged the same number first. The author already ran
          # `make bump-patch`; telling them to run it again is the one instruction
          # that looks wrong and is right, so it has to say WHY.
          #
          # Two open PRs in one repo hit this by construction: each carries a bump
          # computed when it was opened, and whichever merges first takes the number.
          # A submodule-bump sweep that opens three PRs in a repo hits it twice.
          # (bdh-org/dev-common#208, found merging seven bump PRs on 2026-08-16.)
          #
          # NOT fixed by comparing against the merge base instead: that would pass a
          # stale bump and let two changes land on ONE version, which is the exact
          # thing this check exists to prevent -- the deployed image would report a
          # version belonging to another change.
          mb="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [ -n "$mb" ]; then
            mb_v=$(git show "$mb:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
            if [ -n "$mb_v" ] && [ "$head_v" != "$mb_v" ]; then
              echo "::error::VERSION COLLISION -- this PR bumped $mb_v -> $head_v, but ${{ github.base_ref }} has ALSO reached $head_v."
              echo "::error::Another PR merged that same version first. Your bump was fine; it is now taken."
              echo "::error::Re-bump on top of the updated base:"
              echo "::error::    git fetch origin ${{ github.base_ref }} && git merge origin/${{ github.base_ref }}"
              echo "::error::    make bump-patch && git push"
              echo "::error::Do NOT edit the version by hand, and do NOT re-run this job -- the"
              echo "::error::number is taken until the branch moves."
              exit 1
            fi
          fi
          echo "::error::VERSION is still $base_v but this PR changes:"
          echo "$changed" | sed 's/^/  /'
          echo "::error::Run 'make bump-patch' -- never edit the version by hand."
          echo "::error::Without a bump, tag-version.yml does not fire and the"
          echo "::error::deployed image reports a version belonging to another change."
          exit 1

      # Registry-image deploys deliver DAGs ONLY when the image bakes them: the
      # merge-to-main pipeline ships the image, and Airflow tasks docker-run into
      # it — a dags/ dir the Dockerfile never COPYs means merged DAG changes
      # silently never land (bdh-org/home-infra#15; bit panoptikon/hog/freddyb).
      - name: DAG delivery guardrail
        run: |
          if [ -d dags ] && [ -f Dockerfile ] && ! grep -Eq '^[[:space:]]*COPY[[:space:]]+.*dags' Dockerfile; then
            echo "::error::dags/ exists but the Dockerfile never COPYs it — DAG changes will not be delivered by the registry image. Add 'COPY dags/ /app/dags/' (bdh-org/home-infra#15)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project requirements
        if: inputs.install-requirements
        run: pip install -r ${{ inputs.requirements-file }}

      # Ruff is PINNED, and for the formatter that is not optional. `ruff format`
      # changes its output between patch releases, so an unpinned CI installs
      # whatever shipped that morning and a format gate can go red on a day nobody
      # touched any code. It also guarantees CI and a devcontainer disagree.
      #
      # The version comes from common/RUFF_VERSION when the caller's pin is new
      # enough to have it, and otherwise from RUFF_FALLBACK here.
      #
      # The fallback is NOT laziness -- it is the fix for a real ordering bug. This
      # reusable is consumed at @main, but common/ is whatever revision the CALLER
      # pins, which always lags. Requiring the file made every repo's CI fail the
      # moment this step shipped, because no caller's pin had it yet
      # (finzeug/ferret#41). Both paths are pinned, so neither is the condition this
      # exists to remove; the file simply wins once pins catch up, and the two
      # converge without a flag day.
      - name: Install dev tools
        env:
          RUFF_FALLBACK: "0.16.3"
        run: |
          set -eu
          if [ -r common/RUFF_VERSION ]; then
            RUFF_V="$(tr -d '[:space:]' < common/RUFF_VERSION)"
            echo "pinned ruff ${RUFF_V} (from common/RUFF_VERSION)"
          else
            RUFF_V="${RUFF_FALLBACK}"
            echo "pinned ruff ${RUFF_V} (fallback -- this repo's common/ pin predates RUFF_VERSION)"
          fi
          [ -n "$RUFF_V" ] || { echo "::error::no ruff version resolved -- refusing to install an unpinned formatter"; exit 1; }
          pip install "ruff==${RUFF_V}" pytest pytest-cov

      - name: Lint
        if: inputs.run-lint
        run: ruff check .

      # Excludes the VENDORED trees. `ruff format --check .` from the repo root
      # walks the hydrated submodules too, so ferret's first gated run failed on
      # two files belonging to dev-common -- a repo cannot be gated on its
      # dependency's formatting, and the error names files the author of the PR
      # does not own and cannot fix from there (finzeug/ferret#41).
      #
      # Named explicitly rather than added to each repo's ruff.toml: the set is a
      # property of how this fleet vendors (common, stack-common, lib/*), not of
      # any one repo's style, so it belongs with the workflow that walks them.
      - name: Format check
        if: inputs.check-format
        run: ruff format --check --exclude common --exclude stack-common --exclude lib .

      - name: Test
        if: inputs.run-tests
        run: python -m pytest -vv ${{ inputs.test-path }}
